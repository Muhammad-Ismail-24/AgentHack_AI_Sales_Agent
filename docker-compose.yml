services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # The host path from .env is mounted read-only at this fixed location.
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase-service-account.json
    volumes:
      # settings.py resolves the repo root as the parent of the backend dir,
      # which is / inside this image — so uploads and seeds live at /data.
      - ./data:/data
      # Point FIREBASE_SERVICE_ACCOUNT_PATH_HOST at your key file. Defaults to
      # ./firebase-service-account.json (gitignored) if the variable is unset.
      - ${FIREBASE_SERVICE_ACCOUNT_PATH_HOST:-./firebase-service-account.json}:/secrets/firebase-service-account.json:ro
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
